<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <title>NexusAI - Lab Editor Module</title>
</head>
<body bgcolor="#ffffff" text="#000000">

    <h1>NexusAI: Core Lab Editor</h1>
    <p>Configure your neural design parameters and draft your documentation below.</p>

    <!-- Lab Image Sourced from the Internet -->
    <p>
        <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Modern Science Laboratory" width="600" height="400" />
    </p>

    <hr />

    <form action="/api/save-lab-module" method="POST">
        
        <fieldset>
            <legend>Module Settings</legend>
            
            <p>
                <label for="module_tier">Processing Tier: </label>
                <select name="module_tier" id="module_tier">
                    <option value="standard">Standard Compute</option>
                    <option value="accelerated">Accelerated (GPU)</option>
                    <option value="quantum">Quantum Prototype</option>
                </select>
            </p>

            <p>
                <label for="export_format">Export Format: </label>
                <input type="radio" name="export_format" id="format_xml" value="xml" checked="checked" />
                <label for="format_xml">XML</label>
                
                <input type="radio" name="export_format" id="format_txt" value="txt" />
                <label for="format_txt">TXT</label>
            </p>
        </fieldset>

        <br />

        <fieldset>
            <legend>Lab Notes &amp; Documentation</legend>
            <textarea name="lab_notes" rows="15" cols="80">Initialize module parameters here...</textarea>
        </fieldset>

        <br />

        <input type="submit" value="Save Module State" />
        <input type="reset" value="Reset" />

    </form>

</body>
</html>
